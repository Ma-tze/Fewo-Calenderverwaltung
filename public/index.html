<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belegung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f0">
<title>Fewo-Kalender</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body data-mode="view">
<div class="app">
  <header class="top">
    <div>
      <h1 id="title">Belegung Ferienwohnungen</h1>
      <div class="sub" id="standLine">Lade …</div>
    </div>
    <div class="top-actions">
      <span class="pdfbox pc-only"><input type="month" id="pdfMonth" aria-label="Monat für PDF"><button class="chip" id="pdfBtn" type="button" title="Monatsübersicht mit Kontaktdaten">🖨 Monat als PDF</button><button class="chip" id="pdfBtn2" type="button" title="Ohne Telefon, E-Mail und Notizen zum Aushängen">Aushang</button></span>
      <button class="chip pc-only" id="setBtn" type="button">⚙ Einstellungen</button>
    </div>
  </header>

  <div id="banner" class="notice" hidden></div>

  <div class="toolbar" id="toolbar">
    <h2 id="rangeTitle"></h2>
    <div class="arrows">
      <button class="btn" id="prevBtn" type="button">◀ früher</button>
      <button class="btn" id="nextBtn" type="button">später ▶</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <main id="view"></main>
  <div class="legend" id="legend"></div>

  <nav class="dock" id="dock" aria-label="Ansicht wählen">
    <button type="button" data-nav="today">Heute</button>
    <button type="button" data-nav="w4">4 Wochen</button>
    <button type="button" data-nav="m3">3 Monate</button>
    <button type="button" data-nav="year">Jahr</button>
  </nav>
</div>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>
<script src="/app.js"></script>
</body>
</html>
