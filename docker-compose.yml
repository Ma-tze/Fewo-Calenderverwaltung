services:
  fewo-kalender:
    build: .
    image: fewo-kalender:latest
    container_name: fewo-kalender
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # damit der iCal-Link von Fewo 1 den richtigen Port nennt
      IPAD_PORT: ${IPAD_PORT:-8090}
    ports:
      # iPad-Ansicht (groß, nur lesen) – darf über den Tunnel ins Internet
      - "${IPAD_PORT:-8090}:8080"
      # PC-Verwaltung (Einstellungen, Fewo-1-Plan) – nur im Heimnetz verwenden!
      - "${PC_PORT:-8091}:8081"
    volumes:
      - fewo-data:/data

volumes:
  fewo-data:
